# Traction-demo edge cache. Deploy with `node deploy.mjs` (or paste
# worker.mjs in the dashboard) AFTER creating the new Render service.
# Values live in .env_wrangler (see .env_wrangler.example), passed as
# --var flags — no URLs hardcoded here. Never point this at the judged
# backend.
name = "whofundsit-edge"
main = "worker.mjs"
compatibility_date = "2026-11-01"

# Workers Logs stay on across deploys (otherwise every upload flips the
# dashboard toggles off and the HIT/MISS lines go silent). 100% sampling
# while debugging; lower head_sampling_rate later. If wrangler rejects
# these keys, its error names the exact schema — paste it back.
[observability]
enabled = true
head_sampling_rate = 1
