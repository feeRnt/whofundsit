# Traction-demo edge cache. Deploy with `node deploy.mjs` (or paste
# worker.mjs in the dashboard) AFTER creating the new Render service.
# Values live in .env_wrangler (see .env_wrangler.example), passed as
# --var flags — no URLs hardcoded here. Never point this at the judged
# backend.
name = "whofundsit-edge"
main = "worker.mjs"
compatibility_date = "2026-11-01"

# NOTE: dashboard owns Vars + Observability toggles (a file-only local
# config would wipe them on upload — use the script, which passes
# --keep-vars/--var). Do not re-add [observability] here: wrangler accepts
# the keys but they don't map to the dashboard's logs/issues toggles.
